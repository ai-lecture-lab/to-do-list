<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할일 목록</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 배경 장식용 블롭 -->
  <div class="blob blob_one"></div>
  <div class="blob blob_two"></div>
  <div class="blob blob_three"></div>

  <nav class="top_nav">
    <a class="home_link" href="https://ai-lecture-lab.github.io/">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>
      HOME
    </a>
  </nav>

  <main class="card">
    <header class="card_header">
      <div>
        <p id="today_label" class="today"></p>
        <h1>할일 목록</h1>
      </div>
      <div class="progress_ring" id="progress_ring">
        <span id="progress_text">0%</span>
      </div>
    </header>

    <div class="progress_bar"><div id="progress_fill" class="progress_fill"></div></div>
    <p id="count_label" class="count"></p>

    <form id="todo_form" class="todo_form">
      <input id="todo_input" type="text" placeholder="오늘 무엇을 해야 하나요?" autocomplete="off" maxlength="200" required>
      <button type="submit" aria-label="추가">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </form>

    <ul id="todo_list" class="todo_list"></ul>
    <div id="empty_message" class="empty">
      <div class="empty_icon">✨</div>
      <p>할일이 없습니다. 새 할일을 추가해 보세요!</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
