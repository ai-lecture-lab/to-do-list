<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할일 목록 · AI Lecture Lab</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- 상단 내비게이션: 홈으로 이동 -->
    <nav class="top_nav">
      <a class="home_link" href="https://ai-lecture-lab.github.io/">← HOME</a>
      <span class="muted nav_brand">AI Lecture Lab</span>
    </nav>

    <!-- 상단: 제목 + 날짜 -->
    <section class="top_row">
      <div class="panel greeting">
        <h1>할일 목록 ✅</h1>
        <p class="muted">오늘 할 일을 정리하고 하나씩 완료해 보세요. 브라우저에 자동 저장됩니다.</p>
      </div>
      <div class="panel date_panel">
        <div class="date_day" id="date_day">--</div>
        <div class="muted" id="date_text">----</div>
      </div>
    </section>

    <!-- 수치 타일 -->
    <section class="stat_grid">
      <div class="panel">
        <div class="stat_label">전체 할일</div>
        <div class="stat_value" id="total_value">0</div>
      </div>
      <div class="panel">
        <div class="stat_label">완료</div>
        <div class="stat_value is_good" id="done_value">0</div>
      </div>
      <div class="panel">
        <div class="stat_label">남은 할일</div>
        <div class="stat_value is_accent" id="remain_value">0</div>
      </div>
    </section>

    <!-- 할일 목록 -->
    <section class="panel">
      <div class="panel_title">
        오늘의 할일
        <span class="badge" id="progress_badge">0%</span>
      </div>
      <div class="progress_track"><div class="progress_fill" id="progress_fill"></div></div>
      <p class="muted progress_text" id="progress_text"></p>

      <form id="todo_form" class="todo_form">
        <input id="todo_input" type="text" placeholder="할일을 입력하세요" autocomplete="off" maxlength="200" required>
        <button type="submit">추가</button>
      </form>

      <ul id="todo_list" class="todo_list"></ul>
      <p id="empty_message" class="empty muted">할일이 없습니다. 새 할일을 추가해 보세요.</p>
    </section>

    <footer class="muted">© AI Lecture Lab · ai-lecture-lab.github.io</footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
